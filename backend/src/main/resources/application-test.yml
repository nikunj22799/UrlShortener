spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:urlshortener;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    com.example.urlshortener: WARN