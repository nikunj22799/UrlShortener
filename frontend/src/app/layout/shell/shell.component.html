<a class="skip-link" href="#main-content">
  Skip to main content
</a>

<app-notification-center />

<div class="app-shell">
  <!-- Mobile header -->
  <header class="mobile-header">
    <a
      class="mobile-brand"
      routerLink="/dashboard"
      (click)="closeMenu()"
      aria-label="URL Shortener dashboard"
    >
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M10.6 13.4a4.5 4.5 0 0 0 6.36 0l2.12-2.12a4.5 4.5 0 0 0-6.36-6.36l-1.22 1.22"
          />
          <path
            d="M13.4 10.6a4.5 4.5 0 0 0-6.36 0l-2.12 2.12a4.5 4.5 0 0 0 6.36 6.36l1.22-1.22"
          />
        </svg>
      </span>

      <strong>URL Shortener</strong>
    </a>

    <button
      class="menu-button"
      type="button"
      aria-label="Toggle navigation"
      aria-controls="sidebar-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <span aria-hidden="true">✕</span>
      } @else {
        <span aria-hidden="true">☰</span>
      }
    </button>
  </header>

  <!-- Mobile backdrop -->
  @if (menuOpen()) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Close navigation"
      (click)="closeMenu()"
    ></button>
  }

  <!-- Main sidebar -->
  <aside
    id="sidebar-navigation"
    class="sidebar"
    [class.sidebar--open]="menuOpen()"
    [class.sidebar--collapsed]="sidebarCollapsed()"
  >
    <div class="sidebar-header">
      <a
        class="brand"
        routerLink="/dashboard"
        (click)="closeMenu()"
        aria-label="URL Shortener dashboard"
      >
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M10.6 13.4a4.5 4.5 0 0 0 6.36 0l2.12-2.12a4.5 4.5 0 0 0-6.36-6.36l-1.22 1.22"
            />
            <path
              d="M13.4 10.6a4.5 4.5 0 0 0-6.36 0l-2.12 2.12a4.5 4.5 0 0 0 6.36 6.36l1.22-1.22"
            />
          </svg>
        </span>

        <span class="brand-text">
          <strong>URL Shortener</strong>
          <small>Management Console</small>
        </span>
      </a>

      <button
        class="sidebar-toggle"
        type="button"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        [attr.title]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        (click)="toggleSidebar()"
      >
        <i
          class="bi"
          [class.bi-chevron-right]="sidebarCollapsed()"
          [class.bi-chevron-left]="!sidebarCollapsed()"
          aria-hidden="true"
        ></i>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Primary navigation">
      <a
        class="nav-item"
        routerLink="/dashboard"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        [attr.title]="sidebarCollapsed() ? 'Dashboard' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M3 11.5 12 4l9 7.5" />
            <path d="M5.5 10v9h13v-9" />
            <path d="M9.5 19v-5h5v5" />
          </svg>
        </span>

        <span>Dashboard</span>
      </a>

      <a
        class="nav-item"
        routerLink="/urls/new"
        routerLinkActive="nav-item--active"
        (click)="closeMenu()"
        [attr.title]="sidebarCollapsed() ? 'Create URL' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M10.6 13.4a4 4 0 0 0 5.7 0l2.1-2.1a4 4 0 1 0-5.7-5.7l-1.2 1.2" />
            <path d="M13.4 10.6a4 4 0 0 0-5.7 0l-2.1 2.1a4 4 0 1 0 5.7 5.7l1.2-1.2" />
            <path d="M12 8v8" />
            <path d="M8 12h8" />
          </svg>
        </span>

        <span>Create URL</span>
      </a>

      <a
        class="nav-item"
        routerLink="/urls"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        [attr.title]="sidebarCollapsed() ? 'URL Management' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 6h14" />
            <path d="M5 12h14" />
            <path d="M5 18h14" />
            <circle cx="8" cy="6" r="1.5" />
            <circle cx="16" cy="12" r="1.5" />
            <circle cx="10" cy="18" r="1.5" />
          </svg>
        </span>

        <span>URL Management</span>
      </a>

      <a
        class="nav-item"
        routerLink="/analytics"
        routerLinkActive="nav-item--active"
        (click)="closeMenu()"
        [attr.title]="sidebarCollapsed() ? 'Analytics' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 19V11" />
            <path d="M10 19V6" />
            <path d="M15 19v-4" />
            <path d="M20 19V9" />
          </svg>
        </span>

        <span>Analytics</span>
      </a>

      <div class="nav-divider" aria-hidden="true"></div>

      <p class="nav-section-label">
        Documentation
      </p>

      <a
        class="nav-item"
        routerLink="/project-review"
        routerLinkActive="nav-item--active"
        (click)="closeMenu()"
        [attr.title]="sidebarCollapsed() ? 'Project Review' : null"
      >
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22Z" />
            <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22Z" />
          </svg>
        </span>

        <span>Project Review</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="environment-status">
        <span class="status-indicator" aria-hidden="true"></span>

        <div>
          <strong>Prototype Environment</strong>
        </div>
      </div>

      <button
        class="logout-button"
        type="button"
        [attr.title]="sidebarCollapsed() ? 'Sign out' : null"
        (click)="logout()"
      >
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        <span>Sign out</span>
      </button>

      <p class="version">
        Version 0.1.0
      </p>
    </div>
  </aside>

  <!-- Application content -->
  <div
    class="content-shell"
    [class.content-shell--sidebar-collapsed]="sidebarCollapsed()"
  >
    <main
      id="main-content"
      class="main-content"
      tabindex="-1"
    >
      <router-outlet />
    </main>

    <footer class="app-footer">
      <span>URL Shortener</span>
      <span>Server data is authoritative</span>
    </footer>
  </div>
</div>
