<section class="not-found">
  <div
    class="not-found__icon"
    aria-hidden="true"
  >
    <i
      class="bi bi-search"
    ></i>
  </div>

  <p class="error-code">
    404
  </p>

  <h1>Page not found</h1>

  <p class="description">
    The page you requested does not exist or may have moved.
  </p>

  <div class="actions">
    <a
      class="button"
      routerLink="/dashboard"
    >
      <i
        class="bi bi-house"
        aria-hidden="true"
      ></i>

      Dashboard
    </a>

    <a
      class="button button--secondary"
      routerLink="/urls"
    >
      <i
        class="bi bi-arrow-left"
        aria-hidden="true"
      ></i>

      URL Management
    </a>
  </div>
</section>
